name: Build ISO

on:
  push:
    branches: [main, master]
  release:
    types: [created]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Build Dependencies
        run: |
          pacman -Sy --noconfirm base-devel git curl xz tar gzip \
            grub squashfs-tools dosfstools libisofs openssl

      - name: Get Latest Kernel Version
        run: |
          KERNEL_VERSION=$(curl -s https://www.kernel.org/releases.json | \
            grep -o '"version":"[^"]*' | head -1 | cut -d'"' -f4 || echo "6.8.0")
          echo "Using kernel version: $KERNEL_VERSION"
          echo "$KERNEL_VERSION" > kernel_version.txt

      - name: Build Base System
        run: |
          chmod +x ./build/build.sh
          chmod +x ./repos/repo-update
          chmod +x ./star/star
          chmod +x ./star-build/star-build
          chmod +x ./scripts/version.sh
          chmod +x ./scripts/cross-compile.env
          KERNEL_VERSION=$(cat kernel_version.txt)
          echo "Building with kernel version: $KERNEL_VERSION"
          ./build/build.sh rootfs -k "$KERNEL_VERSION"

      - name: Build Packages
        run: |
          chmod +x ./star-build/star-build
          for pkg in packages/*.def; do
            ./star-build/star-build build "$pkg" || true
          done

      - name: Update Repository
        run: |
          chmod +x ./repos/repo-update
          ./repos/repo-update

      - name: Build ISO
        run: |
          ./build/build.sh iso -k "${{ steps.kernel.outputs.KERNEL_VERSION }}" \
            -v "${{ github.ref_name }}"

      - name: Generate Checksums
        run: |
          cd build/iso
          sha256sum *.iso > SHA256SUMS
          md5sum *.iso > MD5SUMS

      - name: Upload ISO Artifact
        uses: actions/upload-artifact@v4
        with:
          name: openNebula-ISO
          path: build/iso/*.iso
          retention-days: 30

      - name: Upload Checksums
        uses: actions/upload-artifact@v4
        with:
          name: checksums
          path: build/iso/*.sha256
          retention-days: 90

  release:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'release'

    steps:
      - name: Download ISO
        uses: actions/download-artifact@v4
        with:
          name: openNebula-ISO
          path: release

      - name: Download Checksums
        uses: actions/download-artifact@v4
        with:
          name: checksums
          path: release

      - name: Upload to Release
        uses: softprops/action-gh-release@v1
        with:
          files: release/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
